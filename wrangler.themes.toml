name = "typora-themes"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = false

routes = [
  { pattern = "theme2.typora.io/*", zone_name = "typora.io" }
]

# Built by `npm run build`. run_worker_first sends every request through
# worker.js so CORS and cache headers apply to assets too.
[assets]
directory = "./dist/themes"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[vars]
CANONICAL_HOST = "theme2.typora.io"
