#:schema https://docs.typora.io/schema/theme-1.json
# Rebuilt from Typora 1's Academic theme.
name = "Academic"
color-scheme = "light"
author = "Typora"
version = "1.0.0"
description = "A paper compiled with LaTeX: STIX Two Text, justified paragraphs and Latin Modern Mono."
css = "theme.css"

[vars]
body-font = '"STIX Two Text", "Times New Roman", serif'
heading-font = '"STIX Two Text", "Times New Roman", serif'
mono-font = '"Latin Modern Mono Light", "Latin Modern Mono", Menlo, Consolas, monospace'
font-size = "16px"
line-height = 1.5
letter-spacing = "0"
content-width = "720px"
paragraph-spacing = "1em"
text-align = "justify"
bg = "#ffffff"
text = "#333333"
heading = "#333333"
muted = "#555555"
accent = "#aa0000"
link = "#aa0000"
border = "#333333"
code-bg = "#ffffff"
inline-code-bg = "transparent"
highlight = "#fff387"
selection = "rgba(87, 92, 97, 0.3)"
block-selection = "rgba(87, 92, 97, 0.15)"

[[fonts]]
family = "STIX Two Text"
src = "fonts/STIX2Text-Regular.woff"
weight = 400

[[fonts]]
family = "STIX Two Text"
src = "fonts/STIX2Text-Italic.woff"
weight = 400
style = "italic"

[[fonts]]
family = "STIX Two Text"
src = "fonts/STIX2Text-Bold.woff"
weight = 700

[[fonts]]
family = "STIX Two Text"
src = "fonts/STIX2Text-BoldItalic.woff"
weight = 700
style = "italic"

[[fonts]]
family = "Latin Modern Mono Light"
src = "fonts/lmmonolt10-regular-webfont.woff"
weight = 400

[[fonts]]
family = "Latin Modern Mono Light"
src = "fonts/lmmonolt10-oblique-webfont.woff"
weight = 400
style = "italic"

[[fonts]]
family = "Latin Modern Mono Light"
src = "fonts/lmmonolt10-bold-webfont.woff"
weight = 700

[[fonts]]
family = "Latin Modern Mono Light"
src = "fonts/lmmonolt10-boldoblique-webfont.woff"
weight = 700
style = "italic"

[elements.headings]
weight = 700
letter-spacing = "0"
line-height = 1.5

[elements.h1]
size = "2.4em"
align = "center"
margin = ["1em", "1em"]

[elements.h2]
size = "1.8em"
margin = ["1em", "1em"]

[elements.h3]
size = "1.4em"
margin = ["1em", "1em"]

[elements.h4]
size = "1.2em"
margin = ["1em", "1em"]

[elements.h5]
size = "1.1em"
margin = ["1em", "1em"]

[elements.h6]
size = "1em"
margin = ["1em", "1em"]

[elements.strong]
color = "$text"

[elements.link]
underline = "hover"

[elements.inline-code]
border = "transparent"
radius = "0"

[elements.blockquote]
style = "bar"
bar-width = "2px"
bar-color = "$text"
color = "#383838"
italic = true

[elements.code-block]
style = "outline"
border = "$text"
radius = "0"

[elements.table]
style = "grid"
header-bg = "#575c61"

[chrome]
sidebar-bg = "#ffffff"
page-bg = "#ffffff"
text = "#555555"
text-muted = "#888888"
divider = "#ffffff"
border = "#ffffff"
hover-bg = "#f1f4f5"
tree-fg = "#555555"
tree-dir-fg = "#333333"
tree-selected-bg = "#f1f4f5"
tree-selected-fg = "#000000"
