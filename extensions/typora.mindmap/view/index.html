<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mind Map</title>
    <link rel="stylesheet" href="view.css" />
    <script src="../__typora/view.js"></script>
    <script type="module" src="view.js"></script>
  </head>
  <body>
    <div class="toolbar" role="group" aria-label="Mind map controls" hidden>
      <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 10h12" /></svg>
      </button>
      <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 10h12M10 4v12" /></svg>
      </button>
      <button id="options" type="button" aria-label="Mind map options" title="Mind map options" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="4" cy="10" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="16" cy="10" r="1.5"/></svg>
      </button>
    </div>
    <div id="options-menu" role="menu" aria-label="Mind map options" hidden></div>
    <svg id="map" role="group" aria-label="Document mind map" hidden></svg>
    <p id="message" role="status">Loading outline…</p>
  </body>
</html>
