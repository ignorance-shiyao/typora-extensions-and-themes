<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="view.css" />
    <script src="../__typora/view.js"></script>
    <script src="view.js" defer></script>
  </head>
  <body>
    <header class="bar">
      <div class="search">
        <svg class="glass" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.75" />
          <path d="m13 13 4.5 4.5" />
        </svg>
        <input id="query" type="search" placeholder="Search images" autocomplete="off" spellcheck="false" list="recent" aria-label="Search images" />
        <datalist id="recent"></datalist>
        <button id="favorites" class="icon" type="button" title="Favorites" aria-label="Favorites" aria-pressed="false">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 2.6l2.25 4.7 5.15.68-3.77 3.57.95 5.1L10 14.18l-4.58 2.47.95-5.1L2.6 7.98l5.15-.68z" />
          </svg>
        </button>
        <button id="shuffle" class="icon" type="button" title="Shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2.5 5.5h2.7c1.4 0 2.6.7 3.4 1.8l2.8 4.4c.8 1.1 2 1.8 3.4 1.8h2.7" />
            <path d="M2.5 14.5h2.7c1.4 0 2.6-.7 3.4-1.8l.4-.6M11.4 7.9l.4-.6c.8-1.1 2-1.8 3.4-1.8h2.3" />
            <path d="m15.5 3.2 2.3 2.3-2.3 2.3M15.5 12.2l2.3 2.3-2.3 2.3" />
          </svg>
        </button>
      </div>
    </header>

    <main id="results">
      <section id="start" class="start" hidden>
        <p class="caption">Try</p>
        <div id="chips" class="chips"></div>
        <div id="recent-block" hidden>
          <p class="caption">Recent searches</p>
          <div id="recent-chips" class="chips"></div>
        </div>
        <p class="hint">Openly licensed photos and illustrations from Flickr, Wikimedia Commons, museums and more. Click one to insert it.</p>
      </section>
      <p id="caption" class="caption"></p>
      <div id="grid" class="grid" role="list"></div>
      <div id="sentinel" class="sentinel"></div>
      <div id="message" class="message" hidden>
        <p id="message-text"></p>
        <button id="retry" class="retry" type="button" hidden>Try Again</button>
      </div>
    </main>

    <div id="toast" class="toast" role="status" hidden></div>
    <footer class="attribution">Images from Openverse · openly licensed</footer>
  </body>
</html>
