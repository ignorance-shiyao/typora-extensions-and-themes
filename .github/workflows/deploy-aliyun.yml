name: Deploy to Aliyun

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

# Not cancelled midway: the next run waits for Dokku to finish this deploy.
concurrency:
  group: deploy-aliyun

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # A failure on one site does not stop the other.
      matrix:
        include:
          - { site: extensions, app: typora-extensions, domain: extensions.typoraio.cn }
          - { site: themes, app: typora-themes, domain: theme2.typoraio.cn }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # updatedAt in index.json comes from git log
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # No install scripts run next to the deploy secrets.
      - run: npm ci --ignore-scripts

      - name: Validate
        run: npm run validate

      - name: Build
        run: node scripts/build.mjs --origin https://extensions.typoraio.cn --themes-origin https://theme2.typoraio.cn --docs-origin https://docs.typoraio.cn --home-origin https://v2.typoraio.cn

      - name: Published versions keep their bytes
        run: node scripts/immutable.mjs https://extensions.typoraio.cn

      - name: Build V1 theme gallery
        if: matrix.site == 'themes'
        uses: ./.github/actions/build-v1
        with:
          origin: https://theme2.typoraio.cn

      - name: Deploy to ${{ matrix.domain }}
        env:
          SSH_KEY: ${{ secrets.ALIYUN_PEM }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
          SITE: ${{ matrix.site }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::ALIYUN_PEM and KNOWN_HOSTS must be set."
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dokku
          chmod 600 ~/.ssh/dokku

          # scripts/serve.mjs already answers like worker.js. A fresh repository
          # each time: the host only ever needs the latest build.
          site="$RUNNER_TEMP/dokku-site"
          rm -rf "$site"
          mkdir -p "$site/scripts" "$site/dist"
          cp -R "dist/$SITE" "$site/dist"
          cp headers.js "$site"
          cp scripts/serve.mjs scripts/lib.mjs "$site/scripts"
          echo "web: node scripts/serve.mjs --site $SITE" > "$site/Procfile"
          cat > "$site/package.json" <<'JSON'
          {
            "name": "typora-store-site",
            "private": true,
            "type": "module",
            "engines": { "node": "22.x" }
          }
          JSON

          cd "$site"
          git init -q -b master
          git add -A
          git -c user.email=hi@typora.io -c user.name=Typora commit -q -m "Deploy $GITHUB_SHA"
          GIT_SSH_COMMAND='ssh -i ~/.ssh/dokku -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30' \
            git push --force "dokku@dokku.typoraio.cn:$APP" master
