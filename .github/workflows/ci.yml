name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # updatedAt in index.json comes from git log

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Validate
        run: npm run validate

      - name: Permission diff
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          node scripts/permission-diff.mjs "origin/${{ github.base_ref }}"

      - name: Build
        run: npm run build

      - name: Build V1 theme gallery
        uses: ./.github/actions/build-v1

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14
