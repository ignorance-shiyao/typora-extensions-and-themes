name: CI

# Branches of this repository. Pull requests are checked by pr-checks.yml,
# which reads them as data with the base branch's scripts.
on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # updatedAt in index.json comes from git log
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - name: Validate
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build V1 theme gallery
        uses: ./.github/actions/build-v1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 14
