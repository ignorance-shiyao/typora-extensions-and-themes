name: PR review submitted

# Only a trigger: a review on a fork's pull request gets a read-only token,
# so pr-report.yml (workflow_run, trusted) recounts the approvals.
on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Review on ${{ github.event.pull_request.head.sha }}"
